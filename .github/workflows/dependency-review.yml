# Dependency audit — fail a PR whose dependency tree has a known high+ vulnerability.
#
# ENGINE — ci/dependency-review/dep-audit.sh, the native auditor of each ecosystem (bun / npm /
# pnpm / yarn audit, pip-audit, cargo-audit, govulncheck). NOT actions/dependency-review-action:
# that action needs GitHub's Dependency Graph, which a Forgejo instance doesn't have. The old
# workflow probed for the graph and SKIPPED the gate when the probe failed — on Forgejo that was
# every run, so a green "dependency-review" check meant nothing was audited (tg-cli#326). There is
# no probe and no skip now: every run audits, and the audit fails closed (see the script header).
# One gap vs the GitHub action: no license allow/deny policy.
#
# TAMPER-RESISTANCE — why `pull_request_target`:
#   A merge-BLOCKING gate must not run a script the PR itself can edit. Under
#   `pull_request_target` the BASE-branch copy of this workflow AND of dep-audit.sh run; the
#   PR's copies are ignored. The PR head is fetched as a git object and materialized in a SIDE
#   worktree that nothing executes from; dep-audit.sh copies only its manifests/lockfiles out of
#   it and audits them as data (no PR config, no build, no install scripts).
#   HARD RULE: no `bun install` / `npm install` / build / test step here, and never check the PR
#   head out onto the workspace — that WOULD execute PR code under the privileged trigger.
#   Caveat: like any base-run gate, it does NOT run on the PR that first introduces it.

name: dependency-review

on:
  pull_request_target:
  # Pushes to main only: a PR branch is audited by its pull_request_target run (see
  # secret-scan.yml for why per-branch push runs are harmful on Forgejo).
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      head_sha:
        description: 'Commit SHA to audit (required for manual runs)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BASE branch (trusted script)
        # Default ref under pull_request_target = base: the gate script that runs is the base copy.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The toolchain only — `setup-bun` puts the `bun` binary on PATH and runs no project code.
      # Without it a package.json/bun.lock tree fails closed (no auditor).
      - name: Set up bun (bun audit; resolves a lockfile-less package.json as data)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # The base copy's exact pin: no GitHub tag-list API call, so no rate-limit failure (#691).
          bun-version-file: package.json

      # codeql[actions/untrusted-checkout/medium]
      # Justified: the PR head is fetched as a git OBJECT and materialized in a side worktree
      # that is never executed; dep-audit.sh copies only manifests/lockfiles out of it and
      # audits them as data.
      - name: Fetch the PR head commit as DATA (not checked out onto the workspace / not executed)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
        run: |
          set -eu
          if [ -z "${HEAD_SHA:-}" ]; then
            # push: no PR — audit the pushed tree, which is the checked-out workspace.
            echo "AUDIT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            exit 0
          fi
          head_dir="${RUNNER_TEMP:-$(mktemp -d)}/pr-head"
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          git worktree add --detach "$head_dir" "$HEAD_SHA"
          echo "AUDIT_DIR=$head_dir" >> "$GITHUB_ENV"

      # codeql[actions/cache-poisoning/poisonable-step]
      # Justified: runs the trusted base dep-audit.sh over the PR's lockfiles as data; no
      # PR-controlled code runs and no cache is written.
      - name: Dependency audit (fail closed on high+ advisories or an audit that could not run)
        run: bash "$GITHUB_WORKSPACE/ci/dependency-review/dep-audit.sh" "$AUDIT_DIR"
