name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Hard backstop above the in-step stall watchdog (a green run takes ~10 min).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install dependencies
        run: bun install
      - name: Check generated configuration schema and reference
        run: bun run schema:check
      - name: Install pandoc + lsof + Chrome (md-pdf integration test; tg-ctl status lock holder)
        run: |
          sudo apt-get update
          # lsof: `tg-ctl status` finds the poller lock holder with `lsof -t`; stock Ubuntu images lack it
          sudo apt-get install -y pandoc lsof
          # Google Chrome is preinstalled on GitHub's ubuntu-latest (/usr/bin/google-chrome,
          # which findChrome() probes) but not on a stock Ubuntu runner image (Forgejo / GARM),
          # so install it when missing. curl, not wget: a stock image ships no wget.
          command -v google-chrome >/dev/null || {
            deb="${RUNNER_TEMP:-/tmp}/google-chrome-stable_current_amd64.deb"
            curl -fsSL -o "$deb" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y "$deb"
          }
      - name: Test
        # Plain `bun test` under a stall watchdog: a wedged test process fails the step
        # naming the file it hung in, instead of idling silently until the job is killed.
        run: ci/test/bun-test-watchdog.sh

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lockfile is current
        run: uv lock --check
      - name: requirements-tg.txt matches uv.lock
        run: |
          scripts/export-requirements
          git diff --exit-code -- requirements-tg.txt
      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: Standalone switch compatibility (Python 3.9)
        run: |
          uv run ruff check --target-version py39 scripts/tg-impl
          uv run --no-project --python 3.9 python scripts/tg-impl status --json
          uv run --no-project --python 3.9 --with pytest==8.4.2 python -m pytest tests/py/test_switch.py tests/py/test_tg_impl.py -q
      - name: Types
        run: uv run mypy --strict src/tgcli
      - name: Test
        run: uv run pytest -q
