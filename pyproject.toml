[build-system]
requires = ["setuptools>=75,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-call-lib"
dynamic = ["version"]
description = "Independent Telegram call lifecycle and provider adapters"
requires-python = ">=3.12"

[project.optional-dependencies]
call = ["pyrofork>=2.3,<3", "py-tgcalls>=2.2,<3", "aiohttp>=3.14,<4", "qrcode>=8.2,<9"]
voice = ["torch>=2.14,<3", "numpy>=2.4,<3"]

[project.scripts]
tg-call = "telegram_client.cli:caller_main"
tg-mtproto = "telegram_client.cli:personal_main"
tg-call-json = "telegram_client.bridge:main"
call-agent-mock = "telegram_client.mock_agent:main"

[tool.setuptools]
package-dir = {"" = "features"}
packages = ["telegram_client"]

[tool.setuptools.package-data]
telegram_client = ["NOTICE", "*.json", "*.lock", "requirements.txt"]

[tool.setuptools.dynamic]
version = {attr = "telegram_client.call_lib.VERSION"}
