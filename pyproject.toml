[build-system]
requires = ["setuptools>=75,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-cli"
version = "1.73.2"
description = "Telegram CLI for agents: Python port of tg, tg-ctl and call-cli"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "tg-call-lib"]

[project.scripts]
tg = "tgcli.entry:tg"
tg-ctl = "tgcli.entry:tg_ctl"
call-cli = "tgcli.entry:call_cli"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.7", "mypy>=1.13,<2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tgcli*"]

[tool.uv.workspace]
members = ["features"]

[tool.uv.sources]
tg-call-lib = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests/py"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["src/**/*.py", "tests/py/**/*.py"]
extend-include = ["scripts/tg-impl"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/tgcli"]
